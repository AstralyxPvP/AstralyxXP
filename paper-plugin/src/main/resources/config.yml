# AstralyxPvP XP API configuration
# XP is the Discord ENGAGEMENT track (minigames, dailies, coinflip).
# ELO (kills/bounties) is handled elsewhere — this plugin never touches it.
#
# link-worker-url: the private worker that owns the discord_link KV records.
#   GET ?checkLink=<username> -> {linked, discordId, username} (KV source of truth)
# api-base-url: the AstralyxXP worker that holds engagement XP.
#   GET  /api/xp/:discordId        -> the linked account's XP / level / progress
#   GET  /api/linked/:uuid         -> the linked Discord ID for a Minecraft UUID
#   GET  /api/leaderboard?limit=N  -> top XP earners
#   POST /api/link                 -> {discord_id, minecraft_uuid, minecraft_name, merge_xp?}
#   POST /api/merge                -> {discord_id, xp} (keeps the higher side)
#   POST /api/coinflip             -> {discord_id, choice, amount}
#   POST /api/slots                -> {discord_id, amount}
#   POST /api/daily                -> {discord_id}
#   POST /api/transfer             -> {from, to, amount}
#
# ⚠ api-secret is the AstralyxXP worker's Bearer token. Keep it private.
#    The bundled default below is baked in; the live server's config.yml is
#    never overwritten by a new jar, so edits here only affect fresh installs.
link-worker-url: "https://astralyxpvp.chessmrbeaston.workers.dev/api"
api-base-url: "https://astralyx-xp-bot.indiancoder3.workers.dev"
api-secret: "REPLACE_WITH_WORKER_API_SECRET"

# ── Messages ────────────────────────────────────────────────────────────
# All messages support Minecraft color codes with '&', e.g. &e, &a, &c, &7.
# {player} is replaced with the player's name where shown.

# Shown to pending players who try /xp link.
link-prompt: "&e[AstralyxXP] &fYour account isn't connected to Discord yet.\n&7Pick how you want to link:\n&a» &e/linkaccount &7then &e/link <username> <code> &7in Discord\n&a» &e/xp bind <discordId> &7- link your XP account manually, no code\n&7Once linked, your XP syncs between Minecraft and Discord. &cYou only need ONE of these."

# Greeting shown on join to players who haven't chosen yet (and aren't linked).
join-greeting: "&e[AstralyxXP] &fHey &e{player}&f!\n&7Your Discord isn't linked to your Minecraft account yet.\n&a» &e/xp link &7- connect now, your XP syncs everywhere\n&a» &e/xp bind <discordId> &7- or link it manually (no code)\n&b» &e/xp unlinked &7- grind Minecraft-only XP (won't sync, no /link later)\n&cWarning: &7unlinked XP never reaches your Discord, and staff must merge if you switch."

# Prompt shown to pending players when they use a command.
pending-prompt: "&e[AstralyxXP] &fYour account isn't connected to Discord yet.\n&a» &e/xp link &7- connect Discord now (XP syncs everywhere)\n&a» &e/xp bind <discordId> &7- link it manually (no code)\n&b» &e/xp unlinked &7- grind Minecraft-only XP (won't ever sync to Discord)\n&cWarning: &7if you go unlinked, switching to linked later needs staff help."

# Shown after a successful /xp bind. {discordId} is replaced with the bound ID,
# and {merge_note} with which side's XP was kept.
bind-success: "&e[AstralyxXP] &aYour Minecraft account is now linked to Discord &7{discordId}&a!\n&7Your XP syncs between Minecraft and Discord now.{merge_note}"

# Shown when the higher side was the Minecraft-only XP (just merged up).
bind-merge-minecraft: "\n&6%{xp} minecraft XP was higher — it's now your Discord balance! 💪"

# Shown when the higher side was the existing Discord XP (nothing merged).
bind-keep-discord: "\n&7Kept your existing Discord XP balance."

# Shown to linked players who try /xp bind a second time.
bind-already-linked: "&e[AstralyxXP] &7You're already linked. Your XP syncs everywhere!"

# ── End of configuration ────────────────────────────────────────────────