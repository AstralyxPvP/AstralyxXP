name: AstralyxXP
version: '1.1.0'
main: com.astralyxpvp.AstralyxXP
api-version: '1.21'
description: In-game XP commands backed by the AstralyxPvP worker API. Works for linked (Discord-synced) and unlinked (Minecraft-only) players.
author: AstralyxPvP
softdepend: [PlaceholderAPI]
commands:
  xp:
    description: View your Astralyx XP / level, or manage your link status.
    usage: |
      /xp - view your XP
      /xp link - link your Discord account
      /xp bind <discordId> - manually link your XP account (overrides linkaccount)
      /xp unlinked - choose Minecraft-only XP (no /link later)
      /xp claim - claim your daily reward
  balance:
    description: View your Astralyx XP balance.
    usage: /balance
    aliases: [bal]
  daily:
    description: Claim your daily XP reward.
    usage: /daily
  coinflip:
    description: Bet XP on a coin flip.
    usage: /coinflip <heads|tails> <amount>
    aliases: [cf, flip]
  slots:
    description: Play the one-armed bandit and risk XP.
    usage: /slots <amount>
    aliases: [slot, casino]
  transfer:
    description: Send XP to another online player.
    usage: /transfer <player> <amount>
    aliases: [pay, give]
  leaderboard:
    description: View the top Astralyx XP earners.
    usage: /leaderboard [limit]
    aliases: [lb, top]
  astralyxxp:
    description: Query or grant Astralyx account XP for server scripts.
    usage: /astralyxxp <xp|givexp> <player> [amount]
    permission: astralyxxp.admin
permissions:
  astralyxxp.use:
    description: Allows use of AstralyxXP player commands.
    default: true
  astralyxxp.admin:
    description: Allows querying and granting Astralyx XP for server scripts.
    default: op